<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Генератор QR-кодов</title>
  <!-- Bootstrap 5 CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>
<body class="bg-light d-flex flex-column min-vh-100 justify-content-center align-items-center">

  <div class="container p-4 bg-white rounded shadow" style="max-width: 480px;">
    <h1 class="mb-4 text-center text-primary">Генератор QR-кодов</h1>

    <form method="POST">
      <div class="mb-3">
        <label for="text" class="form-label">Введите текст или ссылку</label>
        <textarea
          class="form-control"
          id="text"
          name="text"
          rows="4"
          placeholder="Например, https://example.com"
          required
        >{{ input_text }}</textarea>
      </div>
      <button type="submit" class="btn btn-primary w-100">Сгенерировать QR-код</button>
    </form>

    {% if qr_img %}
    <div class="mt-4 text-center">
      <h5>Ваш QR-код:</h5>
      <img src="data:image/png;base64,{{ qr_img }}" alt="QR Code" class="img-fluid border rounded" />
    </div>
    {% endif %}
  </div>

  <!-- Bootstrap 5 JS Bundle (необязательно) -->
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
